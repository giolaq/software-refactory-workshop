name: Deploy Factory to AWS

on:
  push:
    branches:
      - codex/feat-aws-github-cloud
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws-factory
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
      FACTORY_REGISTRY_STACK: ${{ vars.FACTORY_REGISTRY_STACK }}
      FACTORY_STACK: ${{ vars.FACTORY_STACK }}
      GITHUB_REPOSITORY_URL: ${{ vars.FACTORY_TARGET_REPOSITORY_URL }}
      GITHUB_TOKEN_SECRET_ARN: ${{ vars.FACTORY_GITHUB_TOKEN_SECRET_ARN }}
      REVIEWER_TOKEN_SECRET_ARN: ${{ vars.FACTORY_REVIEWER_TOKEN_SECRET_ARN }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
      BEDROCK_MODEL_RESOURCE_ARNS: ${{ vars.BEDROCK_MODEL_RESOURCE_ARNS }}
      FACTORY_DOMAIN_NAME: ${{ vars.FACTORY_DOMAIN_NAME }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
      ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
      COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
      FACTORY_GIT_USER_NAME: ${{ vars.FACTORY_GIT_USER_NAME }}
      FACTORY_GIT_USER_EMAIL: ${{ vars.FACTORY_GIT_USER_EMAIL }}
      FACTORY_TASK_CPU: ${{ vars.FACTORY_TASK_CPU }}
      FACTORY_TASK_MEMORY: ${{ vars.FACTORY_TASK_MEMORY }}
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          required=(
            AWS_REGION AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN AWS_CLOUDFORMATION_ROLE_ARN
            FACTORY_REGISTRY_STACK FACTORY_STACK GITHUB_REPOSITORY_URL
            GITHUB_TOKEN_SECRET_ARN BEDROCK_MODEL_ID BEDROCK_MODEL_RESOURCE_ARNS
            FACTORY_DOMAIN_NAME ROUTE53_HOSTED_ZONE_ID ACM_CERTIFICATE_ARN
            COGNITO_DOMAIN_PREFIX FACTORY_GIT_USER_NAME FACTORY_GIT_USER_EMAIL
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Deployment setting ${name} is empty. Run deploy/aws/setup-autodeploy.sh."
              exit 2
            fi
          done

      - name: Check out the deployment revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: GitHubFactoryDeploy

      - name: Build and deploy the Factory
        run: bash deploy/aws/deploy.sh

      - name: Publish the Control Center address
        if: success()
        shell: bash
        run: |
          url="$(aws cloudformation describe-stacks \
            --region "${AWS_REGION}" \
            --stack-name "${FACTORY_STACK}" \
            --query 'Stacks[0].Outputs[?OutputKey==`ControlCenterUrl`].OutputValue' \
            --output text)"
          {
            echo "## Factory deployment"
            echo
            echo "Deployed commit \`${GITHUB_SHA}\` to [${url}](${url})."
          } >> "${GITHUB_STEP_SUMMARY}"
