[factory]
max_retries = 2
poll_interval = 20
agent_timeout = 900
gate_timeout = 300

[agents]
bedrock = '{python} {factory_dir}/bedrock_adapter.py run --prompt {prompt} --workspace {worktree}'
claude = 'claude -p "$(cat {prompt})" --permission-mode acceptEdits'
codex = '{codex} exec --sandbox workspace-write --ephemeral "$(cat {prompt})"'
pi = 'pi -p --no-session "$(cat {prompt})"'
cursor = 'cursor-agent -p "$(cat {prompt})"'
mock = '{python} {factory_dir}/mock_agent.py {ticket} --scenario {scenario} --attempt {attempt} < {prompt}'
mock-qa = '{python} {factory_dir}/mock_qa_agent.py {ticket} --scenario {scenario} < {prompt}'
mock-supervisor = '{python} {factory_dir}/mock_supervisor.py {prompt}'
mock-review = '{python} {factory_dir}/mock_review_agent.py {ticket} {prompt} --attempt {attempt}'

[agent_capabilities.bedrock]
protocol_version = 1
features = ["structured-planning", "native-read-only", "container-execution"]
execution_environment = "container"
filesystem_mode = "workspace-write"
allowed_working_roots = ["worktree"]
network_expectation = "provider-only"
environment_allowlist = ["PATH", "HOME", "TMPDIR", "LANG", "AWS_REGION", "AWS_DEFAULT_REGION", "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI", "AWS_CONTAINER_CREDENTIALS_FULL_URI", "AWS_CONTAINER_AUTHORIZATION_TOKEN", "AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE", "AWS_EC2_METADATA_DISABLED", "AWS_CA_BUNDLE", "AWS_PROFILE", "AWS_CONFIG_FILE", "AWS_SHARED_CREDENTIALS_FILE", "AWS_SDK_LOAD_CONFIG", "HTTPS_PROXY", "NO_PROXY", "FACTORY_BEDROCK_MODEL_ID", "FACTORY_BEDROCK_MAX_TURNS"]
credential_names = []
read_only_template = '{python} {factory_dir}/bedrock_adapter.py run --prompt {prompt} --workspace {worktree} --read-only'

[agent_capabilities.claude]
protocol_version = 1
features = ["structured-planning", "native-read-only", "subagents"]
execution_environment = "local"
filesystem_mode = "workspace-write"
allowed_working_roots = ["worktree"]
network_expectation = "provider-only"
environment_allowlist = ["PATH", "HOME", "TMPDIR", "LANG", "TERM", "CLAUDE_CONFIG_DIR"]
credential_names = []
read_only_template = 'claude -p "$(cat {prompt})" --permission-mode plan'

[agent_capabilities.codex]
protocol_version = 1
features = ["structured-planning", "native-read-only", "subagents"]
execution_environment = "local"
filesystem_mode = "workspace-write"
allowed_working_roots = ["worktree"]
network_expectation = "provider-only"
environment_allowlist = ["PATH", "HOME", "TMPDIR", "LANG", "TERM", "CODEX_HOME", "AWS_REGION", "AWS_DEFAULT_REGION"]
credential_names = []
read_only_template = '{codex} exec --sandbox read-only --ephemeral "$(cat {prompt})"'

[agent_capabilities.pi]
protocol_version = 1
features = ["structured-planning", "native-read-only"]
execution_environment = "local"
filesystem_mode = "workspace-write"
allowed_working_roots = ["worktree"]
network_expectation = "provider-only"
environment_allowlist = ["PATH", "HOME", "TMPDIR", "LANG", "LC_ALL", "TERM", "PI_API_KEY", "PI_OFFLINE", "GOOGLE_API_KEY", "ANTHROPIC_API_KEY", "OPENAI_API_KEY", "GROQ_API_KEY", "MISTRAL_API_KEY", "OPENROUTER_API_KEY", "XAI_API_KEY", "ZAI_API_KEY"]
credential_names = []
read_only_template = 'pi -p --no-session --tools read "$(cat {prompt})"'

[agent_capabilities.cursor]
protocol_version = 1
features = []
execution_environment = "local"
filesystem_mode = "workspace-write"
allowed_working_roots = ["worktree"]
network_expectation = "provider-only"
environment_allowlist = ["PATH", "HOME", "TMPDIR", "LANG", "TERM"]
credential_names = []

[agent_capabilities.mock]
protocol_version = 1
features = []
execution_environment = "local"
filesystem_mode = "workspace-write"
allowed_working_roots = ["worktree"]
network_expectation = "none"
environment_allowlist = ["PATH", "HOME", "TMPDIR", "LANG"]
credential_names = []
read_only_template = '{python} {factory_dir}/mock_agent.py {ticket} --scenario {scenario} --attempt {attempt}'

[agent_capabilities."mock-qa"]
protocol_version = 1
features = []
execution_environment = "local"
filesystem_mode = "workspace-write"
allowed_working_roots = ["worktree"]
network_expectation = "none"
environment_allowlist = ["PATH", "HOME", "TMPDIR", "LANG"]
credential_names = []

[agent_capabilities."mock-supervisor"]
protocol_version = 1
features = ["native-read-only"]
execution_environment = "local"
filesystem_mode = "read-only"
allowed_working_roots = ["repository"]
network_expectation = "none"
environment_allowlist = ["PATH", "HOME", "TMPDIR", "LANG"]
credential_names = []

[agent_capabilities."mock-review"]
protocol_version = 1
features = ["native-read-only"]
execution_environment = "local"
filesystem_mode = "read-only"
allowed_working_roots = ["worktree"]
network_expectation = "none"
environment_allowlist = ["PATH", "HOME", "TMPDIR", "LANG"]
credential_names = []
read_only_template = '{python} {factory_dir}/mock_review_agent.py {ticket} {prompt} --attempt {attempt}'

[supervisor]
agent = "codex"

[review]
agent = "codex"

[qa]
agent = "codex"
max_retries = 1
require_human_approval = false
